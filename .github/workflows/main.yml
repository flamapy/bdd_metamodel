name: Python analysis

on: [push, pull_request]

env:
  # The flamapy siblings the jobs install follow the branch being built. Commits always land on
  # develop, and a .devN tag on develop publishes a dev release: those builds take the siblings
  # from develop. The stable branch (main, or master in fw/fm/sat/bdd) only receives merges from
  # develop and its tags publish the stable release: those builds take the siblings' stable
  # branches, merged first in dependency order.
  FLAMAPY_FW_REF: ${{ (contains(fromJSON('["main", "master"]'), github.base_ref || github.ref_name) || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'dev'))) && 'master' || 'develop' }}
  FM_METAMODEL_REF: ${{ (contains(fromJSON('["main", "master"]'), github.base_ref || github.ref_name) || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'dev'))) && 'master' || 'develop' }}
  PYSAT_METAMODEL_REF: ${{ (contains(fromJSON('["main", "master"]'), github.base_ref || github.ref_name) || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'dev'))) && 'master' || 'develop' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installing dependencies
        run: |
              python -m pip install --upgrade pip
              pip install setuptools
              pip install "git+https://github.com/flamapy/flamapy_fw@${FLAMAPY_FW_REF}"
              pip install "git+https://github.com/flamapy/fm_metamodel@${FM_METAMODEL_REF}"
              pip install .
      - name: Installing Ruff linter
        run: |
            pip install ruff
      - name: Running Ruff linter
        run: |
            ruff check .
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install "git+https://github.com/flamapy/flamapy_fw@${FLAMAPY_FW_REF}"
          pip install "git+https://github.com/flamapy/fm_metamodel@${FM_METAMODEL_REF}"
          pip install .
      - name: Running static types with mypy
        run: |
          mypy -p flamapy
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dd ships a pure-Python engine (autoref); the CUDD engine needs dd built from source.
        dd-engine: [autoref, cudd]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools
          # The sibling packages the dev pins and the test extra need are not on PyPI
          # until their release: take them from git (see the *_REF variables at the top).
          pip install "git+https://github.com/flamapy/flamapy_fw@${FLAMAPY_FW_REF}"
          pip install "git+https://github.com/flamapy/fm_metamodel@${FM_METAMODEL_REF}"
          pip install "git+https://github.com/flamapy/pysat_metamodel@${PYSAT_METAMODEL_REF}"
          pip install ".[test]"
          sudo add-apt-repository universe
          sudo apt update
          sudo apt install graphviz -y
          pip install graphviz
      - name: Build dd with CUDD
        if: matrix.dd-engine == 'cudd'
        run: |
          pip install cython setuptools wheel
          DD_FETCH=1 DD_CUDD=1 pip install --force-reinstall --no-deps --no-build-isolation \
            --no-binary dd "dd==0.6.0"
      - name: Check the dd engine
        run: |
          python -c "from flamapy.metamodels.bdd_metamodel.models.bdd_model import DD_BACKEND as b; print(b); assert b == '${{ matrix.dd-engine }}'"
      - name: Running test
        run: |
          python -m pytest
